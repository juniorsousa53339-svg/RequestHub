services:
  db:
    image: postgres:16-alpine
    container_name: requesthub-db
    environment:
      POSTGRES_DB: requesthub
      POSTGRES_USER: requesthub
      POSTGRES_PASSWORD: requesthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: requesthub-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/requesthub
      SPRING_DATASOURCE_USERNAME: requesthub
      SPRING_DATASOURCE_PASSWORD: requesthub
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      - db

volumes:
  pgdata: