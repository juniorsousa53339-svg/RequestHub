<div class="container page">
  <header class="page-header">
    <div>
      <h2 class="title">Minhas Solicitações</h2>
      <p class="muted">Aqui você cria e acompanha suas solicitações.</p>
    </div>

    <div class="header-actions">
      <button type="button" class="btn btn-primary btn-sm" (click)="toggleCriar()">
        {{ mostrarFormCriar ? 'Fechar formulário' : 'Criar nova' }}
      </button>

      <a class="btn btn-ghost btn-sm" routerLink="/login" (click)="trocarUsuario()">
        Trocar usuário
      </a>
    </div>
  </header>

  <div *ngIf="mensagem" class="alert feedback">
    {{ mensagem }}
  </div>

  <!-- FORM CRIAR -->
  <div class="card create-card" *ngIf="mostrarFormCriar">
    <h3 class="section-title">Nova solicitação</h3>

    <div class="form">
      <div class="field">
        <label class="label">Nome</label>
        <input class="input" [(ngModel)]="novo.nome" name="novoNome" />
      </div>

      <div class="field">
        <label class="label">Descrição</label>
        <textarea class="input textarea" [(ngModel)]="novo.descricao" name="novoDesc"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary btn-sm" type="button" (click)="criar()" [disabled]="carregando">
          {{ carregando ? 'Salvando...' : 'Salvar' }}
        </button>
        <button class="btn btn-ghost btn-sm" type="button" (click)="toggleCriar()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- LISTA EM CARDS -->
  <ng-container *ngIf="solicitacoes$ | async as solicitacoes; else loading">
    <p *ngIf="solicitacoes.length === 0" class="muted">
      Você ainda não abriu nenhuma solicitação.
    </p>

    <div class="cards" *ngIf="solicitacoes.length > 0">
      <article class="ticket" *ngFor="let s of solicitacoes">
        <div class="ticket-top">
          <div>
            <div class="ticket-title">{{ s.nome }}</div>
            <div class="ticket-sub muted">{{ s.createdAt | date:'dd/MM/yyyy HH:mm' }}</div>
          </div>

          <span class="badge"
                [ngClass]="{
                  'badge-open': s.status === 'ABERTA',
                  'badge-progress': s.status === 'EM_ANDAMENTO',
                  'badge-done': s.status === 'FINALIZADA'
                }">
            {{ s.status }}
          </span>
        </div>

        <!-- modo leitura -->
        <div class="ticket-desc" *ngIf="editId !== s.id">
          {{ s.descricao }}
        </div>

        <!-- modo edição inline -->
        <div class="edit-form" *ngIf="editId === s.id">
          <div class="field">
            <label class="label">Nome</label>
            <input class="input" [(ngModel)]="editModel.nome" name="editNome{{s.id}}" />
          </div>

          <div class="field">
            <label class="label">Descrição</label>
            <textarea class="input textarea" [(ngModel)]="editModel.descricao" name="editDesc{{s.id}}"></textarea>
          </div>

          <div class="actions">
            <button class="btn btn-primary btn-sm" type="button" (click)="salvarEdicao(s.id)" [disabled]="carregando">
              {{ carregando ? 'Salvando...' : 'Salvar' }}
            </button>
            <button class="btn btn-ghost btn-sm" type="button" (click)="cancelarEdicao()">
              Cancelar
            </button>
          </div>
        </div>

        <!-- ações -->
        <div class="ticket-actions">
          <button
            *ngIf="podeEditar(s) && editId !== s.id"
            type="button"
            class="btn btn-ghost btn-sm"
            (click)="iniciarEdicao(s)"
          >
            Alterar dados
          </button>

          <span *ngIf="!podeEditar(s)" class="muted small">
            Finalizada: não pode alterar
          </span>
        </div>
      </article>
    </div>
  </ng-container>

  <ng-template #loading>
    <p class="muted">Carregando...</p>
  </ng-template>
</div>
