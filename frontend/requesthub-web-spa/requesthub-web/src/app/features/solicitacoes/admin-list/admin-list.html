<div class="container page">
  <header class="page-header">
    <div>
      <h2 class="title">Solicitações</h2>
      <p class="muted">Visão do administrador (todas as solicitações).</p>
    </div>

    <button class="btn btn-ghost btn-sm" type="button" (click)="trocarUsuario()">
      Trocar usuário
    </button>
  </header>

  <div *ngIf="mensagem" class="alert feedback">
    {{ mensagem }}
  </div>

  <ng-container *ngIf="solicitacoes$ | async as solicitacoes; else loading">
    <p *ngIf="solicitacoes.length === 0" class="muted">
      Nenhuma solicitação encontrada.
    </p>

    <div class="cards" *ngIf="solicitacoes.length > 0">
      <article class="ticket" *ngFor="let s of solicitacoes">
        <!-- TOPO -->
        <div class="ticket-top">
          <div>
            <div class="ticket-title">{{ s.nome }}</div>
            <div class="ticket-sub muted">
              {{ s.createdAt | date:'dd/MM/yyyy HH:mm' }}
            </div>
          </div>

          <!-- STATUS (badge clicável) -->
          <div class="status-wrap">
            <button
              type="button"
              class="badge status-btn"
              [ngClass]="{
                'badge-open': s.status === 'ABERTA',
                'badge-progress': s.status === 'EM_ANDAMENTO',
                'badge-done': s.status === 'FINALIZADA'
              }"
              (click)="toggleStatusMenu(s.id)"
            >
              {{ s.status }} ▾
            </button>

            <div class="status-menu" *ngIf="menuStatusAbertoId === s.id">
              <!-- só mostra a próxima opção válida -->
              <button
                *ngIf="s.status === 'ABERTA'"
                type="button"
                class="status-option"
                (click)="alterarStatus(s.id, 'EM_ANDAMENTO')"
              >
                Em andamento
              </button>

              <button
                *ngIf="s.status === 'EM_ANDAMENTO'"
                type="button"
                class="status-option"
                (click)="alterarStatus(s.id, 'FINALIZADA')"
              >
                Finalizada
              </button>

              <div *ngIf="s.status === 'FINALIZADA'" class="status-option disabled">
                Já finalizada
              </div>
            </div>
          </div>
        </div>

        <!-- CORPO -->
        <div class="ticket-desc">
          {{ s.descricao }}
        </div>

        <!-- AÇÕES -->
        <div class="ticket-actions">
          <button type="button" class="btn btn-danger btn-sm" (click)="confirmarExcluir(s.id)">
            Excluir
          </button>
        </div>
      </article>
    </div>
  </ng-container>

  <ng-template #loading>
    <p class="muted">Carregando...</p>
  </ng-template>
</div>
